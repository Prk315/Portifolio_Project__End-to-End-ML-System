data:
  raw_data_path: "data/raw/lending_club.csv"
  processed_data_path: "data/processed/loan_data_clean.csv"
  train_path: "data/processed/train.csv"
  test_path: "data/processed/test.csv"
  val_path: "data/processed/val.csv"

model:
  target_column: "loan_status"
  test_size: 0.2
  val_size: 0.1
  random_state: 42

  baseline:
    name: "logistic_regression"
    max_iter: 1000

  advanced:
    name: "xgboost"
    n_estimators: 200
    max_depth: 7
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    reg_alpha: 0.1
    reg_lambda: 1.0

metrics:
  primary: "f1"
  secondary: ["precision", "recall", "roc_auc"]
  threshold: 0.5

paths:
  models_dir: "models"
  logs_dir: "logs"

api:
  host: "0.0.0.0"
  port: 8000
  model_path: "models/final_model.joblib"
  preprocessor_path: "models/preprocessor.joblib"

monitoring:
  enable_drift_detection: true
  reference_data_path: "data/processed/reference_data.csv"
  drift_threshold: 0.1
